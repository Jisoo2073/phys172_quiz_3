<title>PHYS 172 · 각운동량 퀴즈</title>
<style>
:root {
  color-scheme: light;

  --muted: #506359;

  --line: #dce4dd;

* { box-sizing: border-box; }
body {

button { font: inherit; cursor: pointer; }
button:focus-visible, [tabindex="-1"]:focus-visible { outline: 3px solid #528dce; outline-offset: 4px; }
button:disabled { cursor: default; }
[hidden] { display: none !important; }
.shell { width: min(960px, calc(100% - 40px)); margin: auto; }
header { border-bottom: 1px solid var(--line); }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 65px; }
.brand { display: flex; align-items: center; gap: 11px; font-size: .86rem; font-weight: 750; letter-spacing: .08em; }
.brand-icon {
  display: grid; place-items: center; width: 34px; height: 34px;
  border-radius: 10px; background: var(--green); color: white; font: 21px Georgia, serif;
}
.course { color: var(--muted); font-size: .78rem; }
.intro { margin: 42px 0 23px; }
h1 { margin: 0; font-size: clamp(2rem, 1.5rem + 2.7vw, 3.45rem); line-height: 1.15; letter-spacing: -.065em; }
.intro p { margin: 10px 0 0; color: var(--muted); }
.controls, .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; }
.controls { margin-bottom: 25px; }
.btn {
  min-height: 44px; padding: 8px 15px; border: 1px solid var(--line);
  border-radius: 10px; background: #fff; color: var(--ink); font-weight: 650; font-size: .9rem;
}
.btn:hover:not(:disabled) { border-color: var(--green); background: var(--mint); }
.btn:disabled { color: #64726a; background: #edf0eb; }
.primary { background: var(--green); border-color: var(--green); color: white; }
.primary:hover:not(:disabled) { background: #114c3c; color: white; }
.count { margin-left: 5px; font-variant-numeric: tabular-nums; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 224px; gap: 16px; align-items: start; padding-bottom: 42px; }
.card, aside {
  border: 1px solid var(--line); border-radius: 17px; background: #fff;
  box-shadow: 0 8px 24px #18282408;
}
.card { padding: clamp(18px, 4vw, 32px); min-width: 0; }
aside { padding: 19px; }
.topline { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px 12px; }
.meta { font-size: .82rem; font-weight: 700; color: var(--muted); }
.mode { padding: 3px 9px; border-radius: 6px; color: var(--green); background: var(--mint); }
h2 { margin: 17px 0 20px; font-size: clamp(1.12rem, 1rem + .55vw, 1.4rem); line-height: 1.62; letter-spacing: -.025em; overflow-wrap: anywhere; }
h3 { margin: 0; font-size: .9rem; }
.progress-label { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
progress { display: block; width: 100%; height: 9px; margin-top: 10px; border: 0; border-radius: 9px; overflow: hidden; background: #e9eee9; accent-color: var(--green); }
progress::-webkit-progress-bar { background: #e9eee9; }
progress::-webkit-progress-value { background: var(--green); }
progress::-moz-progress-bar { background: var(--green); }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 14px 0 0; }
.stats div, .metric { background: var(--paper); padding: 9px 11px; border-radius: 9px; }
.stats dt, .metric span { color: var(--muted); font-size: .78rem; }
.stats dd { margin: 0; font-size: 1.2rem; font-weight: 750; }
.helper { margin: 0 0 13px; font-size: .87rem; color: var(--muted); }
.options { display: grid; gap: 8px; }
.option {
  display: flex; align-items: center; gap: 11px; width: 100%; min-height: 51px;
  padding: 10px 12px; background: white; border: 1px solid var(--line); border-radius: 10px;
  text-align: left; color: var(--ink); overflow-wrap: anywhere;

.option:hover:not(:disabled), .option[aria-pressed="true"] { background: var(--mint); border-color: var(--green); }
.option.correct { background: var(--mint); border-color: var(--green); }
.option.incorrect { background: var(--rose); border-color: var(--red); }
.letter { flex: 0 0 26px; width: 26px; height: 26px; display: grid; place-items: center; border-radius: 6px; background: #f0f3ef; font-weight: 750; font-size: .8rem; }
.option-state { margin-left: auto; flex: 0 0 auto; font-size: .76rem; font-weight: 750; }
.feedback { margin: 17px 0 0; padding: 14px 16px; border-radius: 10px; background: #eef3f0; border-left: 4px solid var(--green); }
.feedback.bad { background: var(--rose); border-color: var(--red); }
.feedback p { margin: 6px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.actions { margin-top: 17px; }
.results { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 17px 0; }
.metric strong { display: block; font-size: clamp(1.45rem, 4vw, 2.1rem); letter-spacing: -.035em; line-height: 1.35; }
@media (max-width: 685px) {
  .shell { width: calc(100% - 28px); }
  .intro { margin-top: 28px; }
  .layout { display: flex; flex-direction: column; gap: 12px; }
  .card, aside { width: 100%; }
  aside { order: -1; padding: 12px 14px; }
  .stats { display: none; }
}
@media (max-width: 350px) {
  .course { display: none; }
  .controls .btn { flex: 1 1 auto; }
  .option { gap: 7px; }

const ui = Object.fromEntries(
  [...document.querySelectorAll('[id]')].map(element => [element.id, element])
);
const allQuestions = quizData.map((_, index) => index);
const storageKey = 'phys172-angular-momentum-wrong-v1';
const modeLabels = { sequence: '순서대로 풀기', random: '랜덤 출제', wrong: '오답 노트' };
const wrongQuestions = new Set(readWrongQuestions());

let mode = 'sequence';
let order = [];
let position = 0;
let correctCount = 0;
let gradedCount = 0;
let responses = new Set();
let graded = false;

function readWrongQuestions() {
  try {
    const saved = JSON.parse(localStorage.getItem(storageKey) || '[]');
    return Array.isArray(saved) ? saved.filter(index => allQuestions.includes(index)) : [];
  } catch {
    return [];
  }
}

function shuffle(items) {
  const copy = [...items];
  for (let index = copy.length - 1; index > 0; index--) {
    const other = Math.floor(Math.random() * (index + 1));
    [copy[index], copy[other]] = [copy[other], copy[index]];
  }
  return copy;
}

function start(nextMode, focus = true) {
  mode = nextMode;
  order = mode === 'wrong'
    ? [...wrongQuestions].sort((a, b) => a - b)
    : mode === 'random' ? shuffle(allQuestions) : [...allQuestions];
  position = 0;
  correctCount = 0;
  gradedCount = 0;
  ui.mode.textContent = modeLabels[mode];
  renderQuestion(focus);
}

function updateProgress() {
  ui.progress.max = Math.max(1, order.length);
  ui.progress.value = gradedCount;
  ui['progress-label'].textContent = gradedCount + ' / ' + order.length;
  ui['total-correct'].textContent = correctCount;
  ui['total-wrong'].textContent = gradedCount - correctCount;
  ui['wrong-count'].textContent = wrongQuestions.size;
}

function addAction(label, callback, primary = false) {
  const button = document.createElement('button');
  button.type = 'button';
  button.className = primary ? 'btn primary' : 'btn';
  button.textContent = label;
  button.addEventListener('click', callback);
  ui.actions.append(button);
  return button;
}

function clearPanel() {
  ui.options.replaceChildren();
  ui.actions.replaceChildren();
  ui.feedback.hidden = true;
  ui.results.hidden = true;
  ui.hint.hidden = true;
}

function renderQuestion(focus = true) {
  clearPanel();
  updateProgress();
  responses = new Set();
  graded = false;
  if (order.length === 0) {
    ui.reference.textContent = '복습';
    ui.question.textContent = '오답 노트가 비어 있어요';
    ui.hint.textContent = '틀린 문제가 생기면 여기에 모여요.';
    ui.hint.hidden = false;
    addAction('순서대로 풀기', () => start('sequence'), true);
  } else {
    const item = quizData[order[position]];
    const reference = item.question.match(/^\[([^\]]+)\]\s*/);
    ui.reference.textContent = (position + 1) + ' / ' + order.length + (reference ? ' · ' + reference[1] : '');
    ui.question.textContent = reference ? item.question.slice(reference[0].length) : item.question;
    if (item.options.length) {
      renderOptions(item);
    } else {
      ui.hint.textContent = '서술형 · 답을 적어 본 뒤 해설과 비교하세요.';
      ui.hint.hidden = false;
      addAction('정답과 해설 보기', () => revealWritten(item), true);
    }
  }
  if (focus) ui.question.focus();
}

function renderOptions(item) {
  const multiple = Array.isArray(item.answer);
  let submit;
  if (multiple) {
    ui.hint.textContent = '복수 선택 · 해당하는 보기를 모두 고른 뒤 정답을 확인하세요.';
    ui.hint.hidden = false;
    submit = addAction('정답 확인', () => {
      const correct = responses.size === item.answer.length && item.answer.every(index => responses.has(index));
      grade(item, correct);
    }, true);
    submit.disabled = true;
  }

  item.options.forEach((label, index) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'option';
    const letter = document.createElement('span');
    letter.className = 'letter';
    letter.textContent = String.fromCharCode(65 + index);
    const optionText = document.createElement('span');
    optionText.textContent = label;
    button.append(letter, optionText);
    if (multiple) button.setAttribute('aria-pressed', 'false');
    button.addEventListener('click', () => {
      if (graded) return;
      if (multiple) {
        if (responses.has(index)) responses.delete(index);
        else responses.add(index);
        button.setAttribute('aria-pressed', String(responses.has(index)));
        submit.disabled = responses.size === 0;
      } else {
        responses.add(index);
        grade(item, index === item.answer);
      }
    });
    ui.options.append(button);
  });
}

function showFeedback(item, title, incorrect = false) {
  ui.verdict.textContent = title;
  ui.explanation.textContent = item.explanation;
  ui.feedback.classList.toggle('bad', incorrect);
  ui.feedback.hidden = false;
}

function revealWritten(item) {
  showFeedback(item, '정답과 해설');
  ui.actions.replaceChildren();
  addAction('맞았어요', () => grade(item, true), true).focus();
  addAction('틀렸어요', () => grade(item, false));
}

function grade(item, correct) {
  if (graded) return;
  graded = true;
  gradedCount++;
  if (correct) {
    correctCount++;
    wrongQuestions.delete(order[position]);
  } else {
    wrongQuestions.add(order[position]);
  }
  try {
    localStorage.setItem(storageKey, JSON.stringify([...wrongQuestions]));
  } catch {
    // The current session can still review its mistakes.
  }

  const answers = Array.isArray(item.answer) ? item.answer : [item.answer];
  [...ui.options.children].forEach((button, index) => {
    button.disabled = true;
    const isAnswer = answers.includes(index);
    const isWrongSelection = responses.has(index) && !isAnswer;
    button.classList.toggle('correct', isAnswer);
    button.classList.toggle('incorrect', isWrongSelection);
    if (isAnswer || isWrongSelection) {
      const status = document.createElement('span');
      status.className = 'option-state';
      status.textContent = isAnswer ? '정답' : '오답';
      button.append(status);
    }
  });
  showFeedback(item, correct ? '정답이에요' : '오답이에요', !correct);
  updateProgress();
  ui.actions.replaceChildren();
  if (position + 1 === order.length) {
    showResults();
    return;
  }
  addAction('다음 문제 →', () => {
    position++;
    renderQuestion();
  }, true).focus();
}

function showResults() {
  ui.results.hidden = false;
  ui.score.textContent = correctCount + ' / ' + order.length;
  const percentage = correctCount / order.length * 100;
  ui.accuracy.textContent = new Intl.NumberFormat('ko-KR', { maximumFractionDigits: 1 }).format(percentage) + '%';
  ui.mode.textContent = '풀이 완료';
  addAction('처음부터 다시 풀기', () => start(mode === 'random' ? 'random' : 'sequence'), true);
  if (wrongQuestions.size) addAction('오답 다시 풀기', () => start('wrong'));
}

function changeMode(nextMode) {
  if (gradedCount > 0 && gradedCount < order.length
      && !window.confirm('현재 회차를 끝내고 새로 시작할까요? 오답 기록은 계속 남아요.')) return;
  start(nextMode);
}

ui['intro-count'].textContent = '각운동량 원리와 회전 운동 · ' + quizData.length + '문제';
ui.sequential.addEventListener('click', () => changeMode('sequence'));
ui.random.addEventListener('click', () => changeMode('random'));
ui.wrong.addEventListener('click', () => changeMode('wrong'));
start('sequence', false);
</script>
